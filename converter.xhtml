<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en" xml:lang="en">
<head>
<meta http-equiv="Content-Type" content="application/xhtml+xml; charset=UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Converter</title>
<style type="text/css">
/*<![CDATA[*/
:root{--bg:#0a0e1a;--el:#111827;--card:rgba(17,24,39,.75);--hover:rgba(30,41,59,.85);--border:rgba(51,65,85,.6);--bh:rgba(74,222,128,.4);--fg:#f1f5f9;--mut:#94a3b8;--accent:#22c55e;--accent2:#10b981;--soft:rgba(34,197,94,.1);--r:12px;--font:system-ui,-apple-system,sans-serif;--mono:monospace}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);padding:16px}
.shell{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:800px){.shell{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.dropzone{border:2px dashed var(--border);border-radius:10px;padding:18px;text-align:center;cursor:pointer;background:rgba(15,23,42,.5);font-weight:600;font-size:14px}
.dropzone:hover,.dropzone.drag{border-color:var(--accent);background:var(--soft)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mode-tabs{display:flex;gap:4px;background:var(--el);padding:4px;border-radius:8px;border:1px solid var(--border);flex:1}
.mode-btn{flex:1;padding:7px 10px;border-radius:6px;border:none;background:transparent;color:var(--mut);font:600 13px var(--font);cursor:pointer}
.mode-btn.active{background:var(--accent);color:#000}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none}
.chk input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
textarea.code{width:100%;min-height:360px;flex:1;background:#070a12;border:1px solid var(--border);border-radius:8px;padding:10px;color:#e2e8f0;font:12px/1.5 var(--mono);resize:vertical;outline:none}
textarea.code:focus,.inp:focus{border-color:var(--accent)}
.btn{padding:9px 14px;border-radius:8px;border:1px solid var(--border);background:var(--el);color:var(--fg);font:600 13px var(--font);cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--bh);background:var(--hover)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#000}
.inp{flex:1;background:var(--el);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--fg);font:500 13px var(--mono);outline:none}
.status{font:500 12px var(--mono);padding:6px 10px;border-radius:6px;border:1px solid var(--border);color:var(--mut)}
.status.ok{color:#4ade80;border-color:rgba(34,197,94,.35)}
.status.err{color:#f87171;border-color:rgba(239,68,68,.4)}
/*]]>*/
</style>
</head>
<body>
<div class="shell">
  <section class="panel">
    <div class="dropzone" id="dropzone" tabindex="0" role="button">
      Upload / Drop File
      <input type="file" id="fileInput" accept=".html,.htm,.xhtml,.svg,text/html,application/xhtml+xml,image/svg+xml" hidden="hidden" />
    </div>
    <div class="row">
      <div class="mode-tabs">
        <button type="button" class="mode-btn active" id="modeXhtml">XHTML</button>
        <button type="button" class="mode-btn" id="modeSvg">SVG</button>
      </div>
      <label class="chk"><input type="checkbox" id="optShim" checked="checked" /><span>Shim</span></label>
      <label class="chk"><input type="checkbox" id="optCdata" checked="checked" /><span>CDATA</span></label>
      <button type="button" class="btn" id="clearInBtn">Clear</button>
    </div>
    <textarea class="code" id="inputCode" placeholder="Paste code..." spellcheck="false"></textarea>
    <button type="button" class="btn pri" id="convertBtn">Convert</button>
  </section>

  <section class="panel">
    <div class="row">
      <input type="text" class="inp" id="outName" value="index.xhtml" autocomplete="off" />
      <span class="status" id="statusBox">Ready</span>
    </div>
    <textarea class="code" id="outputCode" readonly="readonly" spellcheck="false"></textarea>
    <div class="row">
      <button type="button" class="btn pri" id="downloadBtn" disabled="disabled" style="flex:2">Download</button>
      <button type="button" class="btn" id="previewBtn" disabled="disabled" style="flex:1">Preview</button>
      <button type="button" class="btn" id="copyBtn" disabled="disabled" style="flex:1">Copy</button>
    </div>
  </section>
</div>

<script type="text/javascript">
//<![CDATA[
(function () {
  const $ = id => document.getElementById(id);
  const dropzone = $("dropzone"), fileInput = $("fileInput"), inputCode = $("inputCode"), outputCode = $("outputCode");
  const outName = $("outName"), statusBox = $("statusBox"), modeXhtml = $("modeXhtml"), modeSvg = $("modeSvg");
  const optShim = $("optShim"), optCdata = $("optCdata"), convertBtn = $("convertBtn");
  const downloadBtn = $("downloadBtn"), previewBtn = $("previewBtn"), copyBtn = $("copyBtn"), clearInBtn = $("clearInBtn");

  let targetMode = "xhtml", baseFileName = "index";
  const CDATA_OPEN = "<![CDATA[", CDATA_CLOSE = "]]" + ">";

  const VOID_TAGS = new Set(["area","base","br","col","embed","hr","img","input","link","meta","param","source","track","wbr"]);
  const BOOL_ATTRS = new Set(["allowfullscreen","async","autofocus","autoplay","checked","controls","default","defer","disabled","formnovalidate","hidden","inert","ismap","itemscope","loop","multiple","muted","nomodule","novalidate","open","playsinline","readonly","required","reversed","selected"]);
  const SVG_NS = "http://www.w3.org/2000/svg", XHTML_NS = "http://www.w3.org/1999/xhtml";

  const SVG_ATTR_MAP = {
    "viewbox":"viewBox","preserveaspectratio":"preserveAspectRatio","gradientunits":"gradientUnits","gradienttransform":"gradientTransform","spreadmethod":"spreadMethod","patternunits":"patternUnits","patterntransform":"patternTransform","patterncontentunits":"patternContentUnits","clippathunits":"clipPathUnits","maskunits":"maskUnits","maskcontentunits":"maskContentUnits","filterunits":"filterUnits","primitiveunits":"primitiveUnits","stddeviation":"stdDeviation","basefrequency":"baseFrequency","numoctaves":"numOctaves","stitchtiles":"stitchTiles","targetx":"targetX","targety":"targetY","kernelmatrix":"kernelMatrix","kernelunitlength":"kernelUnitLength","surfacescale":"surfaceScale","specularconstant":"specularConstant","specularexponent":"specularExponent","diffuseconstant":"diffuseConstant","pointsatx":"pointsAtX","pointsaty":"pointsAtY","pointsatz":"pointsAtZ","limitingconeangle":"limitingConeAngle","tablevalues":"tableValues","xchannelselector":"xChannelSelector","ychannelselector":"yChannelSelector","edgemode":"edgeMode","startoffset":"startOffset","textlength":"textLength","lengthadjust":"lengthAdjust","markerwidth":"markerWidth","markerheight":"markerHeight","markerunits":"markerUnits","refx":"refX","refy":"refY","repeatcount":"repeatCount","repeatdur":"repeatDur","calcmode":"calcMode","keytimes":"keyTimes","keysplines":"keySplines","keypoints":"keyPoints","attributename":"attributeName","attributetype":"attributeType","zoomandpan":"zoomAndPan"
  };

  const SVG_TAG_MAP = {
    "clippath":"clipPath","fecolormatrix":"feColorMatrix","fecomponenttransfer":"feComponentTransfer","fecomposite":"feComposite","feconvolvematrix":"feConvolveMatrix","fediffuselighting":"feDiffuseLighting","fedisplacementmap":"feDisplacementMap","fedistantlight":"feDistantLight","fedropshadow":"feDropShadow","feflood":"feFlood","fefunca":"feFuncA","fefuncb":"feFuncB","fefuncg":"feFuncG","fefuncr":"feFuncR","fegaussianblur":"feGaussianBlur","feimage":"feImage","femerge":"feMerge","femergenode":"feMergeNode","femorphology":"feMorphology","feoffset":"feOffset","fepointlight":"fePointLight","fespecularlighting":"feSpecularLighting","fespotlight":"feSpotLight","fetile":"feTile","feturbulence":"feTurbulence","foreignobject":"foreignObject","glyphref":"glyphRef","lineargradient":"linearGradient","radialgradient":"radialGradient","textpath":"textPath"
  };

  const escapeXmlText = s => (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const escapeXmlAttr = s => (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/\t/g, "&#9;").replace(/\n/g, "&#10;").replace(/\r/g, "&#13;");
  const sanitizeXmlName = n => (n || "").replace(/[^a-zA-Z0-9_:.-]/g, "");

  function buildRuntimeShim(isSvgMode) {
    const lines = [
      "(function(){try{var dp=new DOMParser(),ot=Object.getOwnPropertyDescriptor(Element.prototype,'tagName');",
      "if(ot&&ot.get)Object.defineProperty(Element.prototype,'tagName',{get:function(){var v=ot.get.call(this);return(this.namespaceURI==='http://www.w3.org/1999/xhtml'&&v)?v.toUpperCase():v;},configurable:true});",
      "function fs(r){var s=r.querySelectorAll?r.querySelectorAll('svg'):[];for(var i=0;i<s.length;i++)if(!s[i].getAttribute('xmlns'))s[i].setAttribute('xmlns','http://www.w3.org/2000/svg');}",
      "var ih=Object.getOwnPropertyDescriptor(Element.prototype,'innerHTML');",
      "if(ih&&ih.set)Object.defineProperty(Element.prototype,'innerHTML',{get:function(){return ih.get.call(this);},set:function(v){try{ih.set.call(this,v);}catch(e){while(this.firstChild)this.removeChild(this.firstChild);var d=dp.parseFromString('<!DOCTYPE html><html><body>'+v+'</body></html>','text/html');fs(d.body);var n=d.body.childNodes;while(n.length)this.appendChild(document.importNode(n[0],true));}},configurable:true});"
    ];
    if (isSvgMode) {
      lines.push(
        "if(!document.body)Object.defineProperty(document,'body',{get:function(){return document.querySelector('body');},configurable:true});",
        "if(!document.head)Object.defineProperty(document,'head',{get:function(){return document.querySelector('head');},configurable:true});",
        "document.createElement=function(t,o){var k=String(t||'').toLowerCase();return(k==='svg'||k==='path'||k==='circle'||k==='rect'||k==='polygon'||k==='line'||k==='g')?document.createElementNS('http://www.w3.org/2000/svg',k):document.createElementNS('http://www.w3.org/1999/xhtml',k,o);};"
      );
    }
    lines.push("}catch(e){}})();");
    return lines.join("");
  }

  function stripExistingCdata(code) {
    let s = (code || "").trim();
    const co = "/*" + CDATA_OPEN + "*/", cc = "/*" + CDATA_CLOSE + "*/", jo = "//" + CDATA_OPEN, jc = "//" + CDATA_CLOSE;
    if (s.startsWith(co)) s = s.slice(co.length);
    if (s.endsWith(cc)) s = s.slice(0, -cc.length);
    s = s.trim();
    if (s.startsWith(jo)) s = s.slice(jo.length);
    if (s.endsWith(jc)) s = s.slice(0, -jc.length);
    return s.trim();
  }

  function serializeNode(node, parentNs, useCdata) {
    if (node.nodeType === Node.TEXT_NODE) return escapeXmlText(node.nodeValue);
    if (node.nodeType === Node.COMMENT_NODE) return "<!--" + (node.nodeValue || "").replace(/--/g, "- -").replace(/-$/, " ") + "-->";
    if (node.nodeType !== Node.ELEMENT_NODE) return "";

    const ns = node.namespaceURI || XHTML_NS;
    let rawLocal = node.localName || node.nodeName.toLowerCase();
    if (ns === SVG_NS && SVG_TAG_MAP[rawLocal.toLowerCase()]) rawLocal = SVG_TAG_MAP[rawLocal.toLowerCase()];
    else if (ns === XHTML_NS) rawLocal = rawLocal.toLowerCase();

    let out = "<" + rawLocal;
    const seenAttrs = new Set();

    if (ns !== parentNs) { out += ' xmlns="' + escapeXmlAttr(ns) + '"'; seenAttrs.add("xmlns"); }
    if (rawLocal === "html" && ns === XHTML_NS) {
      const langVal = node.getAttribute("lang") || "en";
      if (!node.hasAttribute("lang")) { out += ' lang="' + escapeXmlAttr(langVal) + '"'; seenAttrs.add("lang"); }
      if (!node.hasAttribute("xml:lang")) { out += ' xml:lang="' + escapeXmlAttr(langVal) + '"'; seenAttrs.add("xml:lang"); }
    }

    for (let i = 0; i < node.attributes.length; i++) {
      const attr = node.attributes[i];
      let aName = attr.name;
      if (aName === "xmlns" && seenAttrs.has("xmlns")) continue;
      if (ns === SVG_NS && SVG_ATTR_MAP[aName.toLowerCase()]) aName = SVG_ATTR_MAP[aName.toLowerCase()];
      else if (ns === XHTML_NS && !aName.startsWith("xml:")) aName = aName.toLowerCase();
      aName = sanitizeXmlName(aName);
      if (!aName || seenAttrs.has(aName)) continue;
      seenAttrs.add(aName);

      let aVal = attr.value;
      if (ns === XHTML_NS && BOOL_ATTRS.has(aName) && (aVal === "" || aVal.toLowerCase() === aName)) aVal = aName;
      if (aName.startsWith("xlink:") && !seenAttrs.has("xmlns:xlink")) {
        out += ' xmlns:xlink="http://www.w3.org/1999/xlink"';
        seenAttrs.add("xmlns:xlink");
      }
      out += " " + aName + '="' + escapeXmlAttr(aVal) + '"';
    }

    if (ns === XHTML_NS && VOID_TAGS.has(rawLocal)) return out + " />";
    out += ">";

    if (ns === XHTML_NS && (rawLocal === "script" || rawLocal === "style")) {
      const rawCode = node.textContent || "";
      if (!rawCode.trim()) return out + "</" + rawLocal + ">";
      if (useCdata) {
        const cleanCode = stripExistingCdata(rawCode);
        if (rawLocal === "style") {
          out += "\n/*" + CDATA_OPEN + "*/\n" + cleanCode.split(CDATA_CLOSE).join("]]\\>") + "\n/*" + CDATA_CLOSE + "*/\n";
        } else {
          out += "\n//" + CDATA_OPEN + "\n" + cleanCode.split(CDATA_CLOSE).join("]]]]" + "><" + "![CDATA[>") + "\n//" + CDATA_CLOSE + "\n";
        }
      } else {
        out += escapeXmlText(rawCode);
      }
      return out + "</" + rawLocal + ">";
    }

    for (let c = node.firstChild; c; c = c.nextSibling) out += serializeNode(c, ns, useCdata);
    return out + "</" + rawLocal + ">";
  }

  function extractOriginalCode(rawText) {
    let text = (rawText || "").trim();
    const q3 = '"' + '"' + '"';
    const startIdx = text.indexOf(q3);
    if (startIdx !== -1 && /^[a-zA-Z0-9_]+\s*=\s*$/.test(text.slice(0, startIdx))) {
      const endIdx = text.lastIndexOf(q3);
      if (endIdx > startIdx + 3) text = text.slice(startIdx + 3, endIdx).trim();
    }
    return text;
  }

  function convertHtml(rawInput, mode, includeShim, useCdata) {
    const cleaned = extractOriginalCode(rawInput);
    if (!cleaned) throw new Error("Empty input");
    const parser = new DOMParser();

    if (/^<svg[\s>]/i.test(cleaned) && !/<foreignObject/i.test(cleaned) && mode === "svg") {
      const svgDoc = parser.parseFromString(cleaned, "text/html");
      const svgEl = svgDoc.querySelector("svg");
      if (svgEl) return '<?xml version="1.0" encoding="UTF-8"?>\n' + serializeNode(svgEl, null, useCdata);
    }

    const doc = parser.parseFromString(cleaned, "text/html");
    const htmlEl = doc.documentElement;
    let headEl = doc.head || htmlEl.insertBefore(doc.createElement("head"), htmlEl.firstChild);
    if (!doc.body) htmlEl.appendChild(doc.createElement("body"));

    headEl.querySelectorAll("meta[charset], meta[http-equiv]").forEach(m => {
      if (m.hasAttribute("charset") || (m.getAttribute("http-equiv") || "").toLowerCase() === "content-type") m.remove();
    });
    const ctMeta = doc.createElement("meta");
    ctMeta.setAttribute("http-equiv", "Content-Type");
    ctMeta.setAttribute("content", "application/xhtml+xml; charset=UTF-8");
    headEl.insertBefore(ctMeta, headEl.firstChild);

    const existingShim = doc.getElementById("xhtml-svg-compat-shim");
    if (existingShim) existingShim.remove();
    if (includeShim) {
      const shimScript = doc.createElement("script");
      shimScript.setAttribute("type", "text/javascript");
      shimScript.setAttribute("id", "xhtml-svg-compat-shim");
      shimScript.textContent = buildRuntimeShim(mode === "svg");
      headEl.insertBefore(shimScript, ctMeta.nextSibling);
    }

    const serializedHtml = serializeNode(htmlEl, null, useCdata);
    if (mode === "xhtml") return '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE html>\n' + serializedHtml + "\n";
    return '<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%" style="position:fixed;inset:0;width:100vw;height:100vh;border:0;margin:0;padding:0;overflow:hidden">\n  <foreignObject width="100%" height="100%" x="0" y="0">\n' + serializedHtml + "\n  </foreignObject>\n</svg>\n";
  }

  function runConversion() {
    const raw = inputCode.value;
    if (!raw.trim()) {
      statusBox.className = "status"; statusBox.textContent = "Ready";
      outputCode.value = ""; downloadBtn.disabled = previewBtn.disabled = copyBtn.disabled = true;
      return;
    }
    try {
      const result = convertHtml(raw, targetMode, optShim.checked, optCdata.checked);
      const parsed = new DOMParser().parseFromString(result, targetMode === "svg" ? "image/svg+xml" : "application/xhtml+xml");
      const err = parsed.querySelector("parsererror");
      outputCode.value = result;
      downloadBtn.disabled = previewBtn.disabled = copyBtn.disabled = false;
      statusBox.className = err ? "status err" : "status ok";
      statusBox.textContent = err ? "XML Error" : "OK (" + (result.length / 1024).toFixed(1) + " KB)";
    } catch (e) {
      statusBox.className = "status err"; statusBox.textContent = "Error";
    }
  }

  function handleFile(file) {
    if (!file) return;
    baseFileName = file.name.replace(/\.(html|htm|xhtml|svg)$/i, "") || "index";
    outName.value = baseFileName + (targetMode === "svg" ? ".svg" : ".xhtml");
    const reader = new FileReader();
    reader.onload = ev => { inputCode.value = String(ev.target.result || ""); runConversion(); };
    reader.readAsText(file, "UTF-8");
  }

  dropzone.onclick = () => fileInput.click();
  fileInput.onchange = e => { if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]); };
  dropzone.ondragover = e => { e.preventDefault(); dropzone.classList.add("drag"); };
  dropzone.ondragleave = () => dropzone.classList.remove("drag");
  dropzone.ondrop = e => { e.preventDefault(); dropzone.classList.remove("drag"); if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); };

  function setMode(m) {
    targetMode = m;
    modeXhtml.classList.toggle("active", m === "xhtml");
    modeSvg.classList.toggle("active", m === "svg");
    outName.value = (outName.value.trim().replace(/\.(xhtml|html|htm|svg)$/i, "") || "index") + (m === "svg" ? ".svg" : ".xhtml");
    if (inputCode.value.trim()) runConversion();
  }
  modeXhtml.onclick = () => setMode("xhtml");
  modeSvg.onclick = () => setMode("svg");
  optShim.onchange = optCdata.onchange = () => { if (inputCode.value.trim()) runConversion(); };
  convertBtn.onclick = runConversion;
  inputCode.addEventListener("input", () => { if (inputCode.value.trim()) runConversion(); });
  clearInBtn.onclick = () => { inputCode.value = outputCode.value = fileInput.value = ""; runConversion(); };

  downloadBtn.onclick = () => {
    if (!outputCode.value) return;
    const url = URL.createObjectURL(new Blob([outputCode.value], { type: targetMode === "svg" ? "image/svg+xml;charset=utf-8" : "application/xhtml+xml;charset=utf-8" }));
    const a = document.createElement("a");
    a.href = url; a.download = outName.value.trim() || (targetMode === "svg" ? "index.svg" : "index.xhtml");
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  };

  previewBtn.onclick = () => {
    if (!outputCode.value) return;
    window.open(URL.createObjectURL(new Blob([outputCode.value], { type: targetMode === "svg" ? "image/svg+xml;charset=utf-8" : "application/xhtml+xml;charset=utf-8" })), "_blank");
  };

  copyBtn.onclick = () => {
    if (!outputCode.value) return;
    navigator.clipboard.writeText(outputCode.value);
  };
})();
//]]>
</script>
</body>
</html>
